name: Bug report
description: Something is not working.
title: "[Bug]: "
body:
  - type: input
    id: version
    attributes:
      label: App and Windows version
      placeholder: "Arclo 0.33.0, Windows 11"
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: What were you trying to do, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Steps, screenshot, or example file
