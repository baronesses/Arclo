name: Windows release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/build-single-exe.ps1'
      - 'scripts/prepare-single-exe.py'
      - 'scripts/fetch-bundled-tools.ps1'
      - 'scripts/test-single-exe.ps1'
      - 'scripts/test-localization.ps1'
      - 'global.json'
      - 'NuGet.Config'
      - '.github/workflows/release.yml'

permissions:
  contents: read

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read application version
        id: version
        run: |
          $version = ([xml](Get-Content src/Orbit.App/Orbit.App.csproj -Raw)).Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid application version.' }
          "number=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          gh release view "v$version" --json tagName 2>$null | Out-Null
          "published=$($LASTEXITCODE -eq 0)".ToLowerInvariant() >> $env:GITHUB_OUTPUT
          $global:LASTEXITCODE = 0

      - uses: actions/setup-dotnet@v6
        if: steps.version.outputs.published != 'true'
        with:
          dotnet-version: '9.0.122'

      - uses: actions/setup-python@v7
        if: steps.version.outputs.published != 'true'
        with:
          python-version: '3.13'

      - name: Build standalone executable
        if: steps.version.outputs.published != 'true'
        run: ./scripts/build-single-exe.ps1 -Version '${{ steps.version.outputs.number }}'

      - name: Check standalone executable
        if: steps.version.outputs.published != 'true'
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'release/Arclo-${{ steps.version.outputs.number }}-win-x64-single/Arclo.exe'
          ./scripts/test-single-exe.ps1 -Version '${{ steps.version.outputs.number }}' -Executable $exe
          ./scripts/test-localization.ps1 -Executable $exe -Mode localization
          ./scripts/test-localization.ps1 -Executable $exe -Mode themes

      - name: Publish release
        if: steps.version.outputs.published != 'true'
        run: |
          $notes = @'
          Arclo brings file, image, audio, video, PDF, and archive tools into a native Windows workspace.

          - English and Russian interface.
          - Customizable appearance, radial actions, and batch workflows.
          - Standalone Windows x64 executable with the .NET runtime and 7zr included.

          Download **Arclo.exe** and run it. Optional processing tools are available through the links in the app's Components settings.
          '@
          $notesPath = Join-Path $env:RUNNER_TEMP 'arclo-release-notes.md'
          [IO.File]::WriteAllText($notesPath, $notes, [Text.UTF8Encoding]::new($false))
          $exe = Join-Path $env:GITHUB_WORKSPACE 'release/Arclo-${{ steps.version.outputs.number }}-win-x64-single/Arclo.exe'
          gh release create '${{ steps.version.outputs.tag }}' $exe --title 'Arclo ${{ steps.version.outputs.number }}' --notes-file $notesPath --target $env:GITHUB_SHA --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
